name: Publish beta release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact signed v<major>.<minor>.<patch> tag to build
        required: true
        type: string
      build_number:
        description: Period-separated numeric macOS bundle build number
        required: true
        type: string
      approved_license_spdx:
        description: SPDX identifier approved for the repository license
        required: true
        type: string

permissions: read-all

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build, attest, and publish beta prerelease
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Verify exact signed release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_TAG_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG_SIGNING_PRINCIPAL: ${{ vars.RELEASE_TAG_SIGNING_PRINCIPAL }}
          RELEASE_TAG_SIGNING_FINGERPRINT: ${{ vars.RELEASE_TAG_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { printf 'release tag must match v<major>.<minor>.<patch>\n' >&2; exit 1; }
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]] \
            || { printf 'release tag must be an annotated signed tag\n' >&2; exit 1; }
          for value in \
            "$RELEASE_TAG_SIGNING_PUBLIC_KEY" \
            "$RELEASE_TAG_SIGNING_PRINCIPAL" \
            "$RELEASE_TAG_SIGNING_FINGERPRINT"; do
            [[ -n "$value" ]] \
              || { printf 'release tag SSH verification values are required\n' >&2; exit 1; }
          done
          [[ "$RELEASE_TAG_SIGNING_PUBLIC_KEY" != *$'\n'* ]] \
            || { printf 'release tag signing public key must be a single line\n' >&2; exit 1; }
          [[ "$RELEASE_TAG_SIGNING_PRINCIPAL" =~ ^[A-Za-z0-9._@+-]+$ ]] \
            || { printf 'release tag signing principal is invalid\n' >&2; exit 1; }

          signing_key="$RUNNER_TEMP/release-tag-signing-key.pub"
          allowed_signers="$RUNNER_TEMP/release-tag-allowed-signers"
          printf '%s\n' "$RELEASE_TAG_SIGNING_PUBLIC_KEY" >"$signing_key"
          actual_fingerprint="$(ssh-keygen -lf "$signing_key" -E sha256 | awk '{print $2}')"
          [[ -n "$actual_fingerprint" \
            && "$actual_fingerprint" == "$RELEASE_TAG_SIGNING_FINGERPRINT" ]] \
            || { printf 'release tag signing key fingerprint is not approved\n' >&2; exit 1; }
          printf '%s %s\n' \
            "$RELEASE_TAG_SIGNING_PRINCIPAL" \
            "$RELEASE_TAG_SIGNING_PUBLIC_KEY" >"$allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$allowed_signers"
          git verify-tag "$RELEASE_TAG"
          [[ "$(git rev-parse "HEAD^{commit}")" == "$(git rev-parse "${RELEASE_TAG}^{commit}")" ]] \
            || { printf 'checkout is not the selected tag commit\n' >&2; exit 1; }
          [[ "$(git describe --tags --exact-match HEAD)" == "$RELEASE_TAG" ]] \
            || { printf 'HEAD is not exactly the selected tag\n' >&2; exit 1; }

      - name: Run repository release gate
        run: scripts/check.sh --offline

      - name: Verify release workflow and formula contracts
        run: |
          scripts/release/test-release-workflow.sh
          scripts/release/test-render-formula.sh

      - name: Build ad-hoc signed beta release assets
        env:
          SFERENCE_SWITCH_RELEASE_TAG: ${{ inputs.release_tag }}
          SFERENCE_SWITCH_BUILD_NUMBER: ${{ inputs.build_number }}
          SFERENCE_SWITCH_RELEASE_SIGNING_MODE: adhoc
        run: scripts/release/build-artifacts.sh

      - name: Scan release archive for secrets
        env:
          GITLEAKS_MAX_ARCHIVE_DEPTH: "2"
        run: scripts/security/run-gitleaks.sh dist

      - name: Render checksum-pinned Homebrew formula and patch
        id: formula
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVED_LICENSE_SPDX: ${{ inputs.approved_license_spdx }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifact_name="sference-switch_${version}_darwin_universal.zip"
          artifact="dist/$artifact_name"
          artifact_sha256="$(
            awk -v artifact="$artifact_name" '$2 == artifact { print $1 }' dist/checksums.txt
          )"
          [[ "$artifact_sha256" =~ ^[[:xdigit:]]{64}$ ]] \
            || { printf 'final artifact checksum is missing from checksums.txt\n' >&2; exit 1; }

          tap_stage="$GITHUB_WORKSPACE/dist/homebrew-tap"
          formula="$tap_stage/Formula/sference-switch.rb"
          patch="dist/sference-switch_${version}_homebrew.patch"
          scripts/release/render-formula.sh \
            --tag "$RELEASE_TAG" \
            --sha256 "$artifact_sha256" \
            --approved-license-spdx "$APPROVED_LICENSE_SPDX" \
            --output "$formula" \
            --patch-output "$patch"
          {
            printf 'artifact=%s\n' "$artifact"
            printf 'formula=%s\n' "$formula"
            printf 'patch=%s\n' "$patch"
          } >>"$GITHUB_OUTPUT"

      - name: Attest the exact final ZIP
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.formula.outputs.artifact }}

      - name: Preserve formula and tap patch as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sference-switch-${{ inputs.release_tag }}-homebrew
          path: |
            ${{ steps.formula.outputs.formula }}
            ${{ steps.formula.outputs.patch }}
          if-no-files-found: error
          retention-days: 30

      - name: Create public beta prerelease without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release already exists for %s; refusing to replace or add assets\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/sference-switch_${version}_darwin_universal.zip" \
            "dist/checksums.txt" \
            --prerelease \
            --verify-tag \
            --title "Sference Switch $RELEASE_TAG (Beta)" \
            --notes-from-tag

      - name: Remove ephemeral tag verification files
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/release-tag-signing-key.pub" \
            "$RUNNER_TEMP/release-tag-allowed-signers"

      # Two artifacts, not one: upload-artifact roots the archive at the
      # least common ancestor of its paths. Mixing dist/ and scripts/
      # roots at the repo, so the publish job would receive
      # dist/dist/checksums.txt and dist/scripts/release/publish-s3.sh.
      # Uploading each tree separately keeps both flat on download.
      - name: Preserve release assets for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sference-switch-${{ inputs.release_tag }}-dist
          path: |
            dist/sference-switch_*_darwin_universal.zip
            dist/checksums.txt
          if-no-files-found: error

      - name: Preserve release scripts for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sference-switch-${{ inputs.release_tag }}-scripts
          path: |
            scripts/release/get.sh
            scripts/release/publish-s3.sh
          if-no-files-found: error

  publish:
    name: Publish to get.sference.com
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.0
        with:
          name: sference-switch-${{ inputs.release_tag }}-dist
          path: dist

      - name: Download release scripts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.0
        with:
          name: sference-switch-${{ inputs.release_tag }}-scripts
          path: release-scripts

      - name: Re-verify checksums after artifact round-trip
        run: |
          set -euo pipefail
          # Fail loudly on a layout change rather than on a confusing
          # "No such file or directory" from shasum.
          [[ -f dist/checksums.txt ]] \
            || { printf 'dist/checksums.txt missing; artifact layout changed:\n' >&2
                 find dist release-scripts -type f >&2; exit 1; }
          cd dist
          shasum -a 256 -c checksums.txt
          cd ..

      - name: Publish to S3 and flip stable manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_AWS_ROLE_ARN: ${{ vars.RELEASE_AWS_ROLE_ARN }}
          RELEASE_S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
          RELEASE_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.RELEASE_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          # GitHub OIDC → AWS STS (no third-party action; the release contract
          # test restricts uses: to actions/* only).
          token="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "$RELEASE_AWS_ROLE_ARN" \
            --role-session-name "switch-release-$RELEASE_TAG" \
            --web-identity-token "$token" \
            --duration-seconds 900 \
            --query Credentials --output json)"
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$creds" | python3 -c 'import json,sys; print(json.load(sys.stdin)["AccessKeyId"])')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$creds" | python3 -c 'import json,sys; print(json.load(sys.stdin)["SecretAccessKey"])')"
          export AWS_SESSION_TOKEN="$(printf '%s' "$creds" | python3 -c 'import json,sys; print(json.load(sys.stdin)["SessionToken"])')"
          export AWS_DEFAULT_REGION="eu-central-1"

          # Install the release scripts from the artifact (they were included
          # in the upload for reproducibility).
          chmod +x release-scripts/publish-s3.sh
          release-scripts/publish-s3.sh \
            --tag "$RELEASE_TAG" \
            --dist-dir dist \
            --bucket "$RELEASE_S3_BUCKET" \
            --distribution-id "$RELEASE_CLOUDFRONT_DISTRIBUTION_ID" \
            --channel stable \
            --bootstrap release-scripts/get.sh

      - name: Smoke-test the CDN
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest="$(curl -fsSL --proto '=https' --retry 3 "https://get.sference.com/sference-switch/stable/latest.json")"
          actual="$(printf '%s' "$manifest" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          [[ "$actual" == "$version" ]] \
            || { printf 'CDN manifest version %s != expected %s\n' "$actual" "$version" >&2; exit 1; }
          printf 'CDN manifest confirms %s\n' "$actual"

          # The documented install command must work, not just the manifest.
          # Checking only the manifest let a release pass while
          # `curl https://get.sference.com | sh` served 404.
          bootstrap="$(curl -fsSL --proto '=https' --retry 3 "https://get.sference.com/")"
          printf '%s' "$bootstrap" | head -1 | grep -q '^#!' \
            || { printf 'bootstrap at / is not a shell script\n' >&2; exit 1; }
          printf '%s' "$bootstrap" | sh -n \
            || { printf 'bootstrap at / is not valid POSIX sh\n' >&2; exit 1; }
          printf 'CDN bootstrap is a valid POSIX sh script\n'

          # The manifest must point at a downloadable artifact.
          path="$(printf '%s' "$manifest" | sed -n 's/.*"path"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          curl -fsS --proto '=https' --retry 3 -o /dev/null \
            "https://get.sference.com/$path" \
            || { printf 'manifest path %s is not fetchable\n' "$path" >&2; exit 1; }
          printf 'CDN artifact %s is fetchable\n' "$path"
